databaseChangeLog:
  - changeSet:
      id: 007-01-normalize-visit-status
      author: codex
      changes:
        - update:
            tableName: visit
            columns:
              - column:
                  name: status
                  value: PLANNED
            where: status = 'PRE_REGISTERED'
        - dropDefaultValue:
            tableName: visit
            columnName: status
            columnDataType: varchar(32)
        - addDefaultValue:
            tableName: visit
            columnName: status
            defaultValue: PLANNED
      rollback:
        - dropDefaultValue:
            tableName: visit
            columnName: status
            columnDataType: varchar(32)
        - addDefaultValue:
            tableName: visit
            columnName: status
            defaultValue: PRE_REGISTERED
        - update:
            tableName: visit
            columns:
              - column:
                  name: status
                  value: PRE_REGISTERED
            where: status = 'PLANNED'
