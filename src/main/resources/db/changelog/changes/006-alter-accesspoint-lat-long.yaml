databaseChangeLog:
  - changeSet:
      id: "20240522-add-coords-to-access-point"
      author: "Ranno"

      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: access_point
              columnName: latitude

      changes:
        - addColumn:
            tableName: access_point
            columns:
              - column:
                  name: latitude
                  type: DECIMAL(9,6)
                  remarks: "Hoonete laiuskraad Google Mapsi jaoks"
              - column:
                  name: longitude
                  type: DECIMAL(9,6)
                  remarks: "Hoonete pikkuskraad Google Mapsi jaoks"
