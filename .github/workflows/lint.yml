name: Lint, Format Check and Tests

on:
  pull_request:
    branches: [ main ] # Trigger only on PRs targeting main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Java and XML Formatting with Spotless 
        run: mvn --no-transfer-progress spotless:check

      - name: Java Linting with Checkstyle
        run: mvn --no-transfer-progress checkstyle:check

      - name: Dockerfile Linting with Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: "**/Dockerfile*"
          recursive: true

      - name: Run tests
        run: ./mvnw --no-transfer-progress test
